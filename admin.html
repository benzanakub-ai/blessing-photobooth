<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Blessing Photobooth</title>
    <!-- Libraries สำหรับทำ ZIP, Save File และ Drag-and-Drop ลำดับโฆษณา -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f0f11; color: #f3f4f6; display: flex; height: 100vh; overflow: hidden; }
        
        /* PIN Overlay */
        #pin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f11; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; }
        .pin-box { background: #1a1a1e; padding: 40px; border-radius: 16px; border: 1px solid #2a2a30; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .pin-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; color: #38bdf8; letter-spacing: 2px; }
        .pin-input { font-size: 2rem; padding: 10px; width: 200px; text-align: center; letter-spacing: 10px; background: #0a0a0c; border: 2px solid #333; color: white; border-radius: 8px; margin-bottom: 20px; outline: none; }
        .pin-input:focus { border-color: #38bdf8; }
        .btn-pin { background: #38bdf8; color: #000; font-weight: bold; padding: 12px 30px; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; width: 100%; }

        /* Dashboard Layout */
        #dashboard { display: none; width: 100%; height: 100%; }
        .sidebar { width: 360px; background: #131316; border-right: 1px solid #26262b; display: flex; flex-direction: column; overflow-y: auto; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0a0a0c; overflow-y: hidden; }
        
        /* Sidebar Elements */
        .brand-header { padding: 24px; font-size: 1.2rem; font-weight: 900; color: #38bdf8; border-bottom: 1px solid #26262b; display: flex; align-items: center; justify-content: space-between; }
        .lock-btn { background: #26262b; border: none; color: #ef4444; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .panel { padding: 20px 24px; border-bottom: 1px solid #26262b; }
        .panel-title { font-size: 0.9rem; color: #9ca3af; font-weight: 800; letter-spacing: 1px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }
        input[type="text"], input[type="file"] { background: #0a0a0c; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 6px; width: 100%; font-size: 0.9rem; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; width: 100%; }
        .btn:hover { background: #0369a1; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .btn-danger:hover { background: #ef4444; color: white; }

        /* Template & Ad Lists */
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item { background: #1a1a1e; border: 1px solid #333; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .preview-img { width: 100%; height: 100px; background: #000; border-radius: 4px; object-fit: contain; cursor: grab; }
        
        /* AD Manager Specific */
        .ad-item { flex-direction: row; align-items: center; justify-content: space-between; padding: 8px 12px; }
        .ad-item img { width: 80px; height: 50px; cursor: grab; }
        .del-btn-small { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        /* Main Content: Gallery Toolbar */
        .gallery-header-section { padding: 24px; border-bottom: 1px solid #26262b; background: #131316; }
        .gallery-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .gallery-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .live-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; border: 1px solid #10b981; }
        
        .toolbar-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #0a0a0c; padding: 12px 16px; border-radius: 8px; border: 1px solid #26262b; }
        .toolbar-btn { background: #1a1a1e; color: #fff; border: 1px solid #333; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .toolbar-btn:hover { background: #2a2a30; border-color: #555; }
        .toolbar-btn.blue { background: #0284c7; border-color: #0284c7; }
        .toolbar-btn.blue:hover { background: #0369a1; }
        .toolbar-btn.red { background: #991b1b; border-color: #991b1b; }
        .toolbar-btn.red:hover { background: #7f1d1d; }
        select.toolbar-select { background: #1a1a1e; color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        
        /* Gallery Grid */
        .gallery-scroll-area { flex: 1; overflow-y: auto; padding: 24px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .photo-card { position: relative; background: #131316; border: 2px solid #26262b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
        .photo-card.selected { border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        .photo-img { width: 100%; height: 260px; object-fit: contain; background: #000; border-bottom: 1px solid #26262b; cursor: pointer; }
        
        .check-overlay { position: absolute; top: 10px; left: 10px; width: 24px; height: 24px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
        .photo-card.selected .check-overlay { background: #0ea5e9; border-color: #0ea5e9; }
        .photo-card.selected .check-overlay::after { content: "✓"; color: white; font-weight: bold; }

        .photo-info { padding: 12px; font-size: 0.75rem; color: #9ca3af; display: flex; justify-content: space-between; align-items: center; }
        
        /* ปุ่ม Action สำหรับแต่ละรูป */
        .photo-actions { display: flex; padding: 0 12px 12px; gap: 8px; }
        .action-btn { flex: 1; background: #1a1a1e; border: 1px solid #333; color: white; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .action-btn:hover { background: #2a2a30; border-color: #fff; }
        .action-btn.del:hover { background: #ef4444; border-color: #ef4444; }

    </style>
</head>
<body>
    <!-- PIN Overlay -->
    <div id="pin-overlay">
        <div class="pin-box">
            <div class="pin-title">ADMIN LOGIN</div>
            <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn-pin" id="btn-login">เข้าสู่ระบบ</button>
            <p id="pin-error" style="color: #ef4444; margin-top: 12px; font-size: 0.9rem; display: none;">รหัส PIN ไม่ถูกต้อง!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-header">
                BLESSING PHOTOBOOTH
                <button class="lock-btn" id="btn-logout">🔒 ล็อก</button>
            </div>

            <!-- AD Manager -->
            <div class="panel">
                <div class="panel-title">📢 AD MANAGER</div>
                <div class="form-group">
                    <label>อัปโหลดรูปโฆษณาใหม่ (.JPG, .PNG)</label>
                    <input type="file" id="ad-file" accept="image/png, image/jpeg">
                </div>
                <button class="btn" id="upload-ad-btn" style="background: #4b5563;">☁️ อัปโหลดรูปภาพ</button>
                <span id="ad-status" style="color: #10b981; font-size: 0.8rem; display: block; margin-top: 8px;"></span>
                
                <hr style="border: 0; border-top: 1px solid #26262b; margin: 16px 0;">
                <label style="margin-bottom: 10px; display: block;">ลำดับโฆษณา (ลากขึ้นลงเพื่อสลับตำแหน่ง)</label>
                <div class="list-container" id="ad-list"></div>
                <button class="btn" id="save-ad-order-btn" style="background: #10b981; margin-top: 12px; display: none;">💾 บันทึกลำดับโฆษณา</button>
            </div>

            <!-- Template Manager -->
            <div class="panel">
                <div class="panel-title">🖼️ TEMPLATE MANAGER</div>
                <div class="form-group">
                    <label>ตั้งชื่อเทมเพลต</label>
                    <input type="text" id="tpl-name" placeholder="เช่น Wedding 2x6">
                </div>
                <div class="form-group">
                    <label>อัปโหลดกรอบใหม่ (.PNG เจาะใส)</label>
                    <input type="file" id="tpl-file" accept="image/png, image/jpeg">
                </div>
                <button class="btn" id="upload-tpl-btn">☁️ อัปโหลดเข้าตู้</button>
                <span id="upload-status" style="color: #38bdf8; font-size: 0.8rem; display: block; margin-top: 8px;"></span>
                
                <hr style="border: 0; border-top: 1px solid #26262b; margin: 16px 0;">
                <label style="margin-bottom: 10px; display: block;">กรอบที่ใช้งานอยู่</label>
                <div class="list-container" id="tpl-list">กำลังโหลดรายการ...</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="gallery-header-section">
                <div class="gallery-title-row">
                    <div class="gallery-title">
                        📸 LIVE CLIENT GALLERY
                        <span class="live-badge">● LIVE SYNC</span>
                    </div>
                    <div style="font-size: 0.9rem; color: #9ca3af;">
                        <span id="photo-count" style="color: #fff; font-weight: bold; background: #26262b; padding: 4px 12px; border-radius: 8px; font-size: 1rem;">0 รูป</span>
                    </div>
                </div>

                <!-- Toolbar (เลือก, กรอง, โหลด, ลบ) -->
                <div class="toolbar-row">
                    <button class="toolbar-btn" id="btn-select-all">☐ เลือกทั้งหมด</button>
                    <span id="selection-status" style="color: #0ea5e9; font-weight: bold; font-size: 0.9rem; min-width: 120px;">(เลือกแล้ว 0 รูป)</span>
                    
                    <select class="toolbar-select" id="date-filter">
                        <option value="all">🗓 ดูทุกวัน (ทั้งหมด)</option>
                    </select>

                    <select class="toolbar-select" id="sort-order">
                        <option value="desc">↓ ใหม่สุดไปเก่า</option>
                        <option value="asc">↑ เก่าสุดไปใหม่</option>
                    </select>

                    <div style="flex: 1;"></div>

                    <button class="toolbar-btn blue" id="btn-download-zip" disabled>⬇ โหลดที่เลือก (.zip)</button>
                    <button class="toolbar-btn red" id="btn-delete-selected" disabled>🗑 ลบที่เลือก</button>
                </div>
            </div>
            
            <div class="gallery-scroll-area">
                <div class="gallery-grid" id="gallery-grid">
                    <div style="color: #666; width: 100%; text-align: center; grid-column: 1/-1; padding: 40px;">รอโหลดรูปภาพจากระบบ...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCD_M_Pr4bXW111beYM6-i6uT-SzubZ1OA",
            authDomain: "blessing-photobooth.firebaseapp.com",
            projectId: "blessing-photobooth",
            storageBucket: "blessing-photobooth.firebasestorage.app",
            messagingSenderId: "477726732894",
            appId: "1:477726732894:web:eb683a0b999868cd4bbacf",
            measurementId: "G-P5Y8D2DN5D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let settings = { themes: [], ads: [] };
        let allPhotos = [];
        let selectedPhotoIds = new Set();
        let isSelectAll = false;

        // --- ระบบ PIN ---
        const ADMIN_PIN = "1234";
        
        document.getElementById('btn-login').addEventListener('click', () => {
            const input = document.getElementById('pin-input').value;
            if (input === ADMIN_PIN) {
                document.getElementById('pin-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('pin-overlay').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'flex';
                    initAdmin();
                }, 300);
            } else {
                document.getElementById('pin-error').style.display = 'block';
            }
        });
        
        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            document.getElementById('pin-input').value = "";
            document.getElementById('pin-error').style.display = 'none';
            document.getElementById('pin-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('pin-overlay').style.opacity = '1', 10);
            document.getElementById('dashboard').style.display = 'none';
        });

        // --- เริ่มต้นโหลดข้อมูล Config ---
        async function initAdmin() {
            try {
                const snap = await getDoc(doc(db, "config", "settings"));
                if (snap.exists()) {
                    settings = snap.data();
                    if(!settings.themes) settings.themes = [];
                    if(!settings.ads) settings.ads = [];
                    renderTemplates();
                    renderAds();
                }
                subscribeToLiveGallery();
            } catch (err) { console.error(err); }
        }

        // ====== ส่วนจัดการโฆษณา (AD MANAGER) ======
        function renderAds() {
            const list = document.getElementById('ad-list');
            list.innerHTML = "";
            if (settings.ads.length === 0) { 
                list.innerHTML = "<div style='color:#666; font-size:0.8rem; text-align:center;'>ยังไม่มีภาพโฆษณา</div>"; 
                document.getElementById('save-ad-order-btn').style.display = 'none';
                return; 
            }

            settings.ads.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'list-item ad-item';
                item.setAttribute('data-id', url);
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="color:#666; cursor:grab;">⋮⋮</span>
                        <img src="${url}">
                    </div>
                    <button class="del-btn-small" onclick="deleteAd(${index})">🗑</button>
                `;
                list.appendChild(item);
            });
            
            document.getElementById('save-ad-order-btn').style.display = 'block';

            new Sortable(list, {
                animation: 150,
                onEnd: function () {
                    const newOrder = [];
                    list.querySelectorAll('.ad-item').forEach(el => newOrder.push(el.getAttribute('data-id')));
                    settings.ads = newOrder; 
                }
            });
        }

        document.getElementById('save-ad-order-btn').addEventListener('click', async () => {
            const btn = document.getElementById('save-ad-order-btn');
            btn.textContent = "กำลังบันทึก...";
            await setDoc(doc(db, "config", "settings"), settings);
            btn.textContent = "💾 บันทึกลำดับโฆษณา";
            alert('บันทึกลำดับโฆษณาเรียบร้อยแล้ว');
        });

        window.deleteAd = async function(index) {
            if (!confirm("ต้องการลบภาพโฆษณานี้ใช่หรือไม่?")) return;
            settings.ads.splice(index, 1);
            await setDoc(doc(db, "config", "settings"), settings);
            renderAds();
        };

        document.getElementById('upload-ad-btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('ad-file');
            const status = document.getElementById('ad-status');

            if (fileInput.files.length === 0) return alert("กรุณาเลือกไฟล์ภาพโฆษณา");
            const file = fileInput.files[0];
            status.textContent = "กำลังอัปโหลด กรุณารอ...";

            try {
                const fileRef = ref(storage, `ads/${Date.now()}_${file.name}`);
                await uploadBytes(fileRef, file);
                const downloadUrl = await getDownloadURL(fileRef);

                settings.ads.push(downloadUrl);
                await setDoc(doc(db, "config", "settings"), settings);

                status.textContent = "✔ อัปโหลดโฆษณาสำเร็จ!";
                fileInput.value = "";
                renderAds();
                setTimeout(() => status.textContent = "", 3000);
            } catch (err) { status.textContent = "อัปโหลดล้มเหลว"; }
        });

        // ====== ส่วนจัดการเทมเพลต (TEMPLATE MANAGER) ======
        function renderTemplates() {
            const list = document.getElementById('tpl-list');
            list.innerHTML = "";
            if (settings.themes.length === 0) { list.innerHTML = "<div style='color:#666; font-size:0.8rem;'>ยังไม่มีกรอบรูป</div>"; return; }

            settings.themes.forEach((item, index) => {
                const card = document.createElement('div'); card.className = 'list-item';
                card.innerHTML = `
                    <div style="font-size:0.8rem; color:#9ca3af;">กรอบที่ ${index + 1}</div>
                    <img src="${item.url}" class="preview-img">
                    <div style="font-size:0.85rem; text-align:center; font-weight:bold;">${item.name || 'ไม่มีชื่อ'}</div>
                    <button class="btn btn-danger" style="padding:6px; font-size:0.8rem;" onclick="deleteTemplate(${index})">🗑 ลบทิ้ง</button>
                `;
                list.appendChild(card);
            });
        }

        window.deleteTemplate = async function(index) {
            if (!confirm("ต้องการลบกรอบรูปนี้ใช่หรือไม่?")) return;
            settings.themes.splice(index, 1);
            await setDoc(doc(db, "config", "settings"), settings);
            renderTemplates();
        };

        document.getElementById('upload-tpl-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('tpl-name');
            const fileInput = document.getElementById('tpl-file');
            const status = document.getElementById('upload-status');

            if (!nameInput.value || fileInput.files.length === 0) return alert("กรุณาระบุชื่อและเลือกไฟล์ภาพ");
            
            const file = fileInput.files[0];
            status.textContent = "กำลังอัปโหลด กรุณารอ...";

            try {
                const fileRef = ref(storage, `templates/${Date.now()}_${file.name}`);
                await uploadBytes(fileRef, file);
                const downloadUrl = await getDownloadURL(fileRef);

                settings.themes.push({ name: nameInput.value, url: downloadUrl });
                await setDoc(doc(db, "config", "settings"), settings);

                status.textContent = "✔ อัปโหลดสำเร็จ!";
                nameInput.value = ""; fileInput.value = "";
                renderTemplates();
                setTimeout(() => status.textContent = "", 3000);
            } catch (err) { status.textContent = "อัปโหลดล้มเหลว"; }
        });

        // ====== ระบบ LIVE GALLERY & ฟิลเตอร์ ======
        function subscribeToLiveGallery() {
            const q = query(collection(db, "photobooth_photos"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allPhotos = [];
                const dateSet = new Set();

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
                    const dateStr = dateObj.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
                    
                    allPhotos.push({
                        id: docId,
                        url: data.url,
                        dateObj: dateObj,
                        dateStr: dateStr
                    });
                    dateSet.add(dateStr);
                });

                updateDateFilter(dateSet);
                renderGallery();
            });
        }

        function updateDateFilter(dateSet) {
            const select = document.getElementById('date-filter');
            const currentVal = select.value;
            select.innerHTML = '<option value="all">🗓 ดูทุกวัน (ทั้งหมด)</option>';
            
            Array.from(dateSet).forEach(date => {
                const opt = document.createElement('option');
                opt.value = date;
                opt.textContent = `📅 ${date}`;
                select.appendChild(opt);
            });
            
            if (Array.from(dateSet).includes(currentVal)) select.value = currentVal;
        }

        function getFilteredAndSortedPhotos() {
            const filterDate = document.getElementById('date-filter').value;
            const sortOrder = document.getElementById('sort-order').value;
            
            let filtered = allPhotos;
            if (filterDate !== "all") {
                filtered = allPhotos.filter(p => p.dateStr === filterDate);
            }

            if (sortOrder === "asc") {
                filtered = [...filtered].sort((a,b) => a.dateObj - b.dateObj);
            } else {
                filtered = [...filtered].sort((a,b) => b.dateObj - a.dateObj);
            }
            return filtered;
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const filteredPhotos = getFilteredAndSortedPhotos();
            
            document.getElementById('photo-count').textContent = `${filteredPhotos.length} รูป`;
            
            if (filteredPhotos.length === 0) {
                grid.innerHTML = "<div style='color: #666; width: 100%; text-align: center; grid-column: 1/-1; padding: 40px;'>ไม่มีภาพตามเงื่อนไขที่เลือก</div>";
                return;
            }

            grid.innerHTML = "";
            filteredPhotos.forEach(photo => {
                const isSelected = selectedPhotoIds.has(photo.id);
                const timeStr = photo.dateObj.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
                
                const card = document.createElement('div');
                card.className = `photo-card ${isSelected ? 'selected' : ''}`;
                
                card.innerHTML = `
                    <div class="check-overlay" onclick="toggleSelect('${photo.id}')"></div>
                    <img src="${photo.url}" class="photo-img" onclick="toggleSelect('${photo.id}')">
                    <div class="photo-info">
                        <span>${photo.dateStr}</span>
                        <span>${timeStr} น.</span>
                    </div>
                    <div class="photo-actions">
                        <button class="action-btn" onclick="printImage('${photo.url}')">🖨 พิมพ์</button>
                        <button class="action-btn" onclick="downloadImage('${photo.url}')">⬇ โหลด</button>
                        <button class="action-btn del" onclick="deletePhoto('${photo.id}')">🗑</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateSelectionUI();
        }

        // ระบบเลือกรูป (Select)
        window.toggleSelect = function(id) {
            if (selectedPhotoIds.has(id)) {
                selectedPhotoIds.delete(id);
            } else {
                selectedPhotoIds.add(id);
            }
            renderGallery();
        };

        document.getElementById('btn-select-all').addEventListener('click', () => {
            const filteredPhotos = getFilteredAndSortedPhotos();
            isSelectAll = !isSelectAll;
            
            if (isSelectAll) {
                filteredPhotos.forEach(p => selectedPhotoIds.add(p.id));
                document.getElementById('btn-select-all').innerHTML = "☑ ยกเลิกการเลือก";
            } else {
                selectedPhotoIds.clear();
                document.getElementById('btn-select-all').innerHTML = "☐ เลือกทั้งหมด";
            }
            renderGallery();
        });

        function updateSelectionUI() {
            const count = selectedPhotoIds.size;
            document.getElementById('selection-status').textContent = `(เลือกแล้ว ${count} รูป)`;
            
            const btnDl = document.getElementById('btn-download-zip');
            const btnDel = document.getElementById('btn-delete-selected');
            
            if (count > 0) {
                btnDl.disabled = false; btnDl.style.opacity = 1;
                btnDel.disabled = false; btnDel.style.opacity = 1;
            } else {
                btnDl.disabled = true; btnDl.style.opacity = 0.5;
                btnDel.disabled = true; btnDel.style.opacity = 0.5;
                isSelectAll = false;
                document.getElementById('btn-select-all').innerHTML = "☐ เลือกทั้งหมด";
            }
        }

        document.getElementById('date-filter').addEventListener('change', () => { selectedPhotoIds.clear(); renderGallery(); });
        document.getElementById('sort-order').addEventListener('change', renderGallery);

        // ระบบ Download ZIP
        document.getElementById('btn-download-zip').addEventListener('click', async () => {
            if (selectedPhotoIds.size === 0) return;
            const btn = document.getElementById('btn-download-zip');
            btn.textContent = "กำลังบีบอัดไฟล์...";
            
            try {
                const zip = new JSZip();
                const folder = zip.folder("BlessingPhotobooth");
                
                for (let id of selectedPhotoIds) {
                    const photo = allPhotos.find(p => p.id === id);
                    if(photo) {
                        const response = await fetch(photo.url);
                        const blob = await response.blob();
                        folder.file(`photo_${id.substring(0,6)}.jpg`, blob);
                    }
                }
                
                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, `BlessingPhotobooth_${Date.now()}.zip`);
            } catch (e) {
                console.error(e);
                alert("เกิดข้อผิดพลาดในการโหลด Zip");
            }
            btn.textContent = "⬇ โหลดที่เลือก (.zip)";
        });

        // ระบบลบหลายรูปพร้อมกัน
        document.getElementById('btn-delete-selected').addEventListener('click', async () => {
            if (selectedPhotoIds.size === 0) return;
            if (!confirm(`ยืนยันการลบรูปถ่ายจำนวน ${selectedPhotoIds.size} รูปอย่างถาวร?`)) return;
            
            const btn = document.getElementById('btn-delete-selected');
            btn.textContent = "กำลังลบ...";
            
            for (let id of selectedPhotoIds) {
                await deleteDoc(doc(db, "photobooth_photos", id));
            }
            
            selectedPhotoIds.clear();
            btn.textContent = "🗑 ลบที่เลือก";
            alert("ลบรูปสำเร็จ");
        });

        // --- ปุ่ม Action ของแต่ละรูป ---
        window.printImage = function(url) {
            const printWin = window.open('', '_blank');
            printWin.document.write(`
                <html><head><title>Print Blessing Photobooth</title>
                <style>
                    @page { margin: 0; }
                    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff; }
                    img { max-width: 100%; max-height: 100%; object-fit: contain; }
                </style>
                </head><body>
                <img src="${url}" onload="window.print(); window.close();">
                </body></html>
            `);
            printWin.document.close();
        };

        window.downloadImage = async function(url) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `blessing-photobooth-${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch(e) { window.open(url, '_blank'); }
        };

        window.deletePhoto = async function(docId) {
            if(confirm("ต้องการลบรูปนี้ออกจากแกลเลอรีใช่หรือไม่?")) {
                await deleteDoc(doc(db, "photobooth_photos", docId));
            }
        };

    </script>
</body>
</html>
