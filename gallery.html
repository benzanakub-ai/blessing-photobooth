<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLESSING PHOTOBOOTH - Gallery</title>
    <!-- โหลด FontAwesome และ QRCode.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #222222; color: #f3f4f6; min-height: 100vh; overflow-x: hidden; }
        
        /* 🌟 1. Header */
        .header { text-align: center; padding: 20px; position: sticky; top: 0; background: rgba(34, 34, 34, 0.95); z-index: 10; backdrop-filter: blur(10px); }
        .header-brand { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; color: #fff; margin-bottom: 5px; }
        .header-subtitle { font-size: 1rem; font-weight: bold; color: #aaa; }
        
        /* 🌟 2. Circular Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; padding: 20px; max-width: 900px; margin: 0 auto; justify-items: center; }
        @media (max-width: 500px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }
        
        .circle-item { width: 100%; aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden; cursor: pointer; position: relative; background: #333; transition: transform 0.2s ease; }
        .circle-item:active { transform: scale(0.95); }
        .circle-item img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        
        /* 🌟 3. Modal / Detail View */
        #photo-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1c1c1e; z-index: 100; display: none; flex-direction: column; overflow: hidden; }
        #photo-modal.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #1c1c1e; z-index: 101; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.1); transition: 0.2s; }
        .close-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.9); }
        .modal-title { font-weight: bold; font-size: 1.1rem; }
        .select-all-btn { background: none; border: none; color: #38bdf8; font-size: 1rem; font-weight: bold; cursor: pointer; }
        
        .modal-scroll-area { flex: 1; overflow-y: auto; padding: 10px 20px 40px; }
        .photo-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        /* 🌟 4. Photo Card & Selection */
        .photo-card { background: #2c2c2e; border-radius: 12px; overflow: hidden; position: relative; padding: 0; display: flex; justify-content: center; border: 2px solid transparent; transition: 0.2s; cursor: pointer; }
        .photo-card img { width: 100%; height: auto; max-height: 60vh; object-fit: contain; }
        
        .select-circle { position: absolute; top: 12px; left: 12px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.3); z-index: 10; display: flex; align-items: center; justify-content: center; color: transparent; transition: 0.2s; font-size: 0.9rem; }
        .photo-card.selected { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .photo-card.selected .select-circle { background: #38bdf8; border-color: #38bdf8; color: #fff; }
        .photo-card.selected .select-circle::after { content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900; }

        /* 🌟 5. Action Bar (ด้านล่างสุด) */
        .action-bar { display: flex; justify-content: center; gap: 25px; padding: 15px 20px 25px; background: #1c1c1e; border-top: 1px solid #333; z-index: 101; }
        .action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #fff; cursor: pointer; opacity: 0.4; transition: 0.2s; pointer-events: none; }
        .action-btn.active { opacity: 1; pointer-events: auto; }
        .action-btn:active { transform: scale(0.9); }
        .action-icon { width: 50px; height: 50px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .action-text { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        /* สีประจำปุ่ม */
        .btn-email.active .action-icon { background: #f59e0b; color: #fff; } /* ใช้แทนรูปเซฟ/โหลด */
        .btn-airdrop.active .action-icon { background: #3b82f6; color: #fff; }
        .btn-qr.active .action-icon { background: #a855f7; color: #fff; }
        .btn-print.active .action-icon { background: #ef4444; color: #fff; }

        /* QR Overlay */
        #qr-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; }
        #qr-container { background: #fff; padding: 24px; border-radius: 20px; margin-bottom: 20px; }

        .empty-state { text-align: center; color: #9ca3af; padding: 60px 20px; font-size: 1rem; width: 100%; grid-column: 1/-1; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="header-brand">BLESSING PHOTOBOOTH</div>
        <div class="header-subtitle">Select your photo</div>
    </div>

    <div class="gallery-grid" id="gallery-container">
        <div class="empty-state">
            <div class="spinner"></div>
            กำลังโหลดรูปภาพ...
        </div>
    </div>

    <!-- 🌟 Modal Popup สำหรับเลือกรูป -->
    <div id="photo-modal">
        <div class="modal-header">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title">Select photos</div>
            <button class="select-all-btn" id="btn-select-all" onclick="toggleSelectAll()">Select All</button>
        </div>
        
        <div class="modal-scroll-area">
            <div class="photo-detail-grid" id="modal-photo-grid">
                <!-- JS จะดึงรูปมาแทรกตรงนี้ -->
            </div>
        </div>

        <!-- 🌟 Action Bar เมนูด้านล่าง -->
        <div class="action-bar">
            <button class="action-btn btn-email" id="action-download" onclick="handleDownload()">
                <div class="action-icon"><i class="fa-solid fa-download"></i></div>
                <div class="action-text">Save</div>
            </button>
            <button class="action-btn btn-airdrop" id="action-airdrop" onclick="handleAirDrop()">
                <div class="action-icon"><i class="fa-solid fa-satellite-dish"></i></div> <!-- ไอคอนแชร์/แอร์ดรอป -->
                <div class="action-text">AirDrop</div>
            </button>
            <button class="action-btn btn-qr" id="action-qr" onclick="handleQR()">
                <div class="action-icon"><i class="fa-solid fa-qrcode"></i></div>
                <div class="action-text">Scan QR</div>
            </button>
            <button class="action-btn btn-print" id="action-print" onclick="handlePrint()">
                <div class="action-icon"><i class="fa-solid fa-print"></i></div>
                <div class="action-text">Print</div>
            </button>
        </div>
    </div>

    <!-- หน้าต่างโชว์ QR Code ชั่วคราว -->
    <div id="qr-overlay">
        <div id="qr-container"></div>
        <div style="color:#fff; font-size:1.2rem; font-weight:bold; margin-bottom: 20px;">สแกนเพื่อรับรูปที่เลือก</div>
        <button onclick="document.getElementById('qr-overlay').style.display='none'" style="padding: 12px 30px; font-size: 1.1rem; font-weight:bold; border-radius: 50px; border:none; cursor:pointer;">ปิดหน้าต่าง</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Config ของ Blessing Snap
        const firebaseConfig = {
            apiKey: "AIzaSyA57qyFTexeNyRMTTLUJMNC5Bm24L_K0io",
            authDomain: "blessing-snap.firebaseapp.com",
            projectId: "blessing-snap",
            storageBucket: "blessing-snap.firebasestorage.app",
            messagingSenderId: "324842012527",
            appId: "1:324842012527:web:96a235fbf494d39ce9f29a",
            measurementId: "G-8H8D35R54J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.photoGalleryData = {};
        window.currentModalDocId = null;
        window.selectedUrls = new Set(); // เก็บ URL ที่ถูกติ๊กเลือก

        // ดึงข้อมูลรูป
        const q = query(collection(db, "photobooth_photos"), orderBy("createdAt", "desc"), limit(60));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('gallery-container');
            if (snapshot.empty) {
                container.innerHTML = `<div class="empty-state">ยังไม่มีภาพถ่ายในระบบ<br>(ลองถ่ายรูปที่ตู้ 1 ครั้ง รูปจะขึ้นมาแสดงทันที)</div>`;
                return;
            }
            container.innerHTML = "";
            window.photoGalleryData = {}; 

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const docId = docSnap.id;
                window.photoGalleryData[docId] = data;
                
                const thumbUrl = (data.originalUrls && data.originalUrls.length > 0) ? data.originalUrls[0] : data.stripUrl;
                if(!thumbUrl) return;

                const circle = document.createElement('div');
                circle.className = 'circle-item';
                circle.onclick = () => openModal(docId);
                circle.innerHTML = `<img src="${thumbUrl}" loading="lazy">`;
                container.appendChild(circle);
            });
        }, (error) => {
            document.getElementById('gallery-container').innerHTML = `<div class="empty-state" style="color: #ef4444;">ไม่สามารถเชื่อมต่อฐานข้อมูลได้<br>โปรดรีเฟรชหน้าเว็บอีกครั้ง</div>`;
        });

        // 🌟 1. ระบบ Modal & Selection
        window.openModal = function(docId) {
            window.currentModalDocId = docId;
            window.selectedUrls.clear(); // ล้างของเก่า
            
            const data = window.photoGalleryData[docId];
            const grid = document.getElementById('modal-photo-grid');
            grid.innerHTML = '';

            let allImages = [];
            if(data.originalUrls) allImages = allImages.concat(data.originalUrls);
            if(data.stripUrl) allImages.push(data.stripUrl);

            allImages.forEach((url, i) => {
                // สร้างการ์ดรูปภาพพร้อมปุ่มวงกลม (ติ๊กเลือก)
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.id = `card-${i}`;
                card.onclick = () => toggleSelect(url, `card-${i}`);
                card.innerHTML = `
                    <div class="select-circle"></div>
                    <img src="${url}">
                `;
                grid.appendChild(card);
            });

            updateActionButtons();
            document.getElementById('photo-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            document.getElementById('photo-modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        window.toggleSelect = function(url, cardId) {
            const card = document.getElementById(cardId);
            if (window.selectedUrls.has(url)) {
                window.selectedUrls.delete(url);
                card.classList.remove('selected');
            } else {
                window.selectedUrls.add(url);
                card.classList.add('selected');
            }
            updateActionButtons();
        }

        window.toggleSelectAll = function() {
            const data = window.photoGalleryData[window.currentModalDocId];
            let allImages = [];
            if(data.originalUrls) allImages = allImages.concat(data.originalUrls);
            if(data.stripUrl) allImages.push(data.stripUrl);

            // ถ้าเลือกครบแล้ว ให้เอาออกทั้งหมด / ถ้ายังไม่ครบ ให้เลือกทั้งหมด
            if (window.selectedUrls.size === allImages.length) {
                window.selectedUrls.clear();
                document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('selected'));
                document.getElementById('btn-select-all').textContent = 'Select All';
            } else {
                allImages.forEach((url, i) => {
                    window.selectedUrls.add(url);
                    document.getElementById(`card-${i}`).classList.add('selected');
                });
                document.getElementById('btn-select-all').textContent = 'Deselect All';
            }
            updateActionButtons();
        }

        function updateActionButtons() {
            const count = window.selectedUrls.size;
            const btns = document.querySelectorAll('.action-btn');
            
            // ถ้าเลือกอย่างน้อย 1 รูป ให้ปุ่มสว่างและกดได้
            if (count > 0) {
                btns.forEach(b => b.classList.add('active'));
            } else {
                btns.forEach(b => b.classList.remove('active'));
                document.getElementById('btn-select-all').textContent = 'Select All';
            }
        }

        // 🌟 2. ระบบ Action Buttons
        
        // 2.1 Download
        window.handleDownload = async function() {
            const urls = Array.from(window.selectedUrls);
            alert(`ระบบจะทำการดาวน์โหลดรูปภาพ ${urls.length} รูป`);
            for (let i = 0; i < urls.length; i++) {
                const link = document.createElement('a');
                link.href = urls[i];
                link.download = `Blessing_Photobooth_${Date.now()}_${i+1}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                await new Promise(r => setTimeout(r, 300)); // เว้นจังหวะโหลด
            }
        }

        // 2.2 AirDrop (Share API)
        window.handleAirDrop = async function() {
            if (!navigator.share) {
                alert("อุปกรณ์นี้ไม่รองรับระบบ AirDrop/Share ผ่านเว็บเพจครับ (แนะนำให้เปิดด้วย Safari บน iPhone)");
                return;
            }

            try {
                const urls = Array.from(window.selectedUrls);
                const filesArray = [];
                
                // ดึงไฟล์มาแปลงเป็น Blob เพื่อแชร์รูปเข้าเครื่องตรงๆ
                for (let i = 0; i < urls.length; i++) {
                    const response = await fetch(urls[i]);
                    const blob = await response.blob();
                    const file = new File([blob], `BlessingPhoto_${i+1}.jpg`, { type: 'image/jpeg' });
                    filesArray.push(file);
                }

                if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                    await navigator.share({
                        files: filesArray,
                        title: 'Blessing Photobooth',
                        text: 'ส่งรูปภาพจากตู้ Blessing Photobooth'
                    });
                } else {
                    alert("ไม่สามารถแชร์ไฟล์รูปภาพได้โดยตรง ให้ใช้วิธีดาวน์โหลดแทนครับ");
                }
            } catch (err) {
                console.log(err);
            }
        }

        // 2.3 Scan QR (สร้างคิวอาร์โค้ดลิงก์หน้าแชร์รูป)
        window.handleQR = function() {
            const qrContainer = document.getElementById('qr-container');
            qrContainer.innerHTML = '';
            
            // สร้าง URL โยงไปหน้า share_photobooth.html พร้อมแนบ ID คิวนี้
            let baseUrl = window.location.origin + window.location.pathname;
            baseUrl = baseUrl.replace('gallery.html', 'share_photobooth.html');
            const shareUrl = `${baseUrl}?id=${window.currentModalDocId}`;

            new QRCode(qrContainer, { text: shareUrl, width: 200, height: 200 });
            document.getElementById('qr-overlay').style.display = 'flex';
        }
        // 2.4 Print (อัปเดตระบบพิมพ์ไร้ขอบ 100%)
        window.handlePrint = function() {
            const urls = Array.from(window.selectedUrls);
            const printWin = window.open('', '_blank');
            
            let imagesHtml = '';
            urls.forEach(url => {
                imagesHtml += `<img src="${url}">`;
            });

            printWin.document.write(`
                <html>
                <head>
                    <title>Print Blessing Photobooth</title>
                    <style>
                        /* บังคับปิดขอบและซ่อน Header/Footer ของเบราว์เซอร์ */
                        @page { 
                            margin: 0; 
                            size: auto; 
                        }
                        body, html { 
                            margin: 0; 
                            padding: 0; 
                            width: 100%; 
                            height: 100%; 
                            background: #fff; 
                        }
                        /* บังคับรูปให้เต็มกระดาษพอดีเป๊ะ (ไม่เหลือขอบขาว) */
                        img { 
                            width: 100vw; 
                            height: 100vh; 
                            object-fit: cover; /* ขยายให้เต็มพื้นที่ */
                            display: block; 
                            margin: 0; 
                            padding: 0; 
                            page-break-after: always; 
                        }
                    </style>
                </head>
                <body>
                    ${imagesHtml}
                </body>
                </html>
            `);
            printWin.document.close();
            
            setTimeout(() => {
                printWin.print();
                printWin.close();
            }, 800);
        }

    </script>
</body>
</html>
