<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLESSING PHOTOBOOTH - Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 30px 16px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2rem; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; }
        p { color: #9ca3af; margin-top: 6px; font-size: 0.95rem; }
        
        .gallery-grid { column-count: 4; column-gap: 16px; max-width: 1300px; margin: 0 auto; }
        @media (max-width: 1024px) { .gallery-grid { column-count: 3; } }
        @media (max-width: 640px) { .gallery-grid { column-count: 2; column-gap: 10px; } }

        .photo-card { background: #1f2937; border-radius: 12px; overflow: hidden; margin-bottom: 16px; break-inside: avoid; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #374151; transition: transform 0.2s ease; }
        .photo-card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .photo-card img { width: 100%; height: auto; display: block; object-fit: contain; }
        .photo-actions { padding: 12px; display: flex; justify-content: center; background: #111827; }
        
        .download-btn { background: #38bdf8; color: #000; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; display: inline-block; width: 100%; text-align: center; transition: 0.2s; }
        .download-btn:hover { background: #0ea5e9; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>BLESSING PHOTOBOOTH</h1>
        <p>แตะที่ปุ่มดาวน์โหลดเพื่อบันทึกรูปภาพของคุณ</p>
    </div>

    <div class="gallery-grid" id="gallery-container">
        <div style="text-align: center; grid-column: 1/-1; color: #9ca3af; padding: 40px;">กำลังโหลดรูปภาพ...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCD_M_Pr4bXW111beYM6-i6uT-SzubZ1OA",
            authDomain: "blessing-photobooth.firebaseapp.com",
            projectId: "blessing-photobooth",
            storageBucket: "blessing-photobooth.firebasestorage.app",
            messagingSenderId: "477726732894",
            appId: "1:477726732894:web:eb683a0b999868cd4bbacf",
            measurementId: "G-P5Y8D2DN5D"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ดึงข้อมูล Collection: photobooth_photos แบบเรียลไทม์
        const q = query(collection(db, "photobooth_photos"), orderBy("createdAt", "desc"), limit(60));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('gallery-container');
            if (snapshot.empty) {
                container.innerHTML = `<div style="text-align:center; color:#9ca3af; width:100%; padding: 40px;">ยังไม่มีภาพถ่ายในระบบ<br>(ลองถ่ายรูปที่ตู้ 1 ครั้ง รูปจะขึ้นมาแสดงทันที)</div>`;
                return;
            }

            container.innerHTML = "";
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <a href="${data.url}" target="_blank">
                        <img src="${data.url}" loading="lazy">
                    </a>
                    <div class="photo-actions">
                        <a href="${data.url}" download target="_blank" class="download-btn">⬇ ดาวน์โหลดรูปภาพ</a>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
